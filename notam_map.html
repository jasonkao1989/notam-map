        function resolveLayers(){
          let ok=true;
          NOTAM_REG.forEach(it=>{ if(!it.layer){ const obj = window[it.layerName]; if(obj) it.layer = obj; else ok=false; } });
          if(!ok) return setTimeout(resolveLayers, 80);
          afterResolved();
        }

        function afterResolved(){
          const showLayer=(it)=>{ if(it.layer && !map.hasLayer(it.layer)) it.layer.addTo(map); };
          const hideLayer=(it)=>{ if(it.layer &&  map.hasLayer(it.layer)) map.removeLayer(it.layer); };

          window.selAll  = (s)=>document.querySelectorAll(s).forEach(x=>x.checked=true);
          window.selNone = (s)=>document.querySelectorAll(s).forEach(x=>x.checked=false);

          function parseIds(text){ return (text||'').toUpperCase().split(/[\s,]+/).map(s=>s.trim()).filter(Boolean); }
          function parseFL(s){
            s=(s||'').toUpperCase().trim(); if(!s) return null; let m;
            if((m=s.match(/^FL\s*(\d{2,3})$/))) return parseInt(m[1],10)*100;
            if((m=s.match(/^(\d{2,3})$/)))      return parseInt(m[1],10)*100;
            if((m=s.match(/^(\d+(?:\.\d+)?)\s*FT$/))) return parseFloat(m[1]);
            if((m=s.match(/^(\d+(?:\.\d+)?)\s*M$/)))  return parseFloat(m[1])*3.28084;
            return null;
          }

          const TWT_START = window.TWT_TODAY_START, TWT_END = window.TWT_TODAY_END;
          const overlapInclusive=(a1,a2,b1,b2)=>{ const A1=(a1==null?-Infinity:a1), A2=(a2==null?Infinity:a2); const B1=(b1==null?-Infinity:b1), B2=(b2==null?Infinity:b2); return Math.max(A1,B1) <= Math.min(A2,B2); };

          function selections(){
            const selFIR = Array.from(document.querySelectorAll('.fir:checked')).map(x=>x.value);
            const selCat = Array.from(document.querySelectorAll('.cat:checked')).map(x=>x.value);
            const ids = parseIds(document.getElementById('idInput').value);
            const pinIds = parseIds(document.getElementById('pinInput').value);
            const todayOnly = document.getElementById('todayOnly').checked;
            const minFLft = parseFL(document.getElementById('minFL').value);
            const maxFLft = parseFL(document.getElementById('maxFL').value);
            const maxSpan = parseFloat(document.getElementById('maxSpanKm').value);
            const showLand = document.getElementById('showLand').checked;
            const showSea  = document.getElementById('showSea').checked;
            const showPolyline = document.getElementById('showPolyline').checked;
            return {selFIR, selCat, ids, pinIds, todayOnly, minFLft, maxFLft, maxSpan, showLand, showSea, showPolyline};
          }

          function bindRegionMasters(){
            document.querySelectorAll('.regionMaster').forEach(ms=>{
              const rg = ms.dataset.region;
              const kids = Array.from(document.querySelectorAll(`.fir[data-region="${rg}"]`));
              const sync = ()=>{
                const all = kids.length && kids.every(k=>k.checked);
                const none = kids.length && kids.every(k=>!k.checked);
                ms.checked = all;
                ms.indeterminate = !(all||none);
              };
              ms.addEventListener('change', ()=>{ kids.forEach(k=>k.checked = ms.checked); applyFilter(); sync(); });
              kids.forEach(k=> k.addEventListener('change', sync));
              sync();
            });
          }

          window.applyFilter = function(){
            const S = selections();
            NOTAM_REG.forEach(it=>{
              if(!it.layer) return;
              const pinned = S.pinIds.length && S.pinIds.some(nd=>it.id.includes(nd));
              if(pinned) { if(!map.hasLayer(it.layer)) it.layer.addTo(map); return; }

              const okCode = (!S.selFIR.length) || S.selFIR.includes(it.code);
              const okCat  = (!S.selCat.length) || S.selCat.includes(it.cat);
              const okId   = (!S.ids.length)    || S.ids.some(nd=>it.id.includes(nd));
              const okTime = (!S.todayOnly) || overlapInclusive(it.st,it.et,TWT_START,TWT_END);

              const lo=(it.lo==null?0:it.lo), hi=(it.hi==null?999999:it.hi);
              const fmin=(S.minFLft==null?-1:S.minFLft), fmax=(S.maxFLft==null?9999999:S.maxFLft);
              const okAlt = (S.minFLft==null && S.maxFLft==null) ? true : (Math.max(lo, max=0, fmin) <= Math.min(hi, fmax));

              const okSpan = (isNaN(S.maxSpan)) ? true : (it.span <= S.maxSpan + 1e-6);

              let okSeaLand = true;
              if(!S.showLand && it.sea==='LAND') okSeaLand=false;
              if(!S.showSea  && it.sea==='SEA')  okSeaLand=false;

              const okPolyline = S.showPolyline ? true : (!it.lineOnly);

              if(okCode && okCat && okId && okTime && okAlt && okSpan && okSeaLand && okPolyline) {
                if(!map.hasLayer(it.layer)) it.layer.addTo(map);
              } else {
                if(map.hasLayer(it.layer)) map.removeLayer(it.layer);
              }
            });
          };

          window.resetFilter = function(){
            document.querySelectorAll('.fir,.cat').forEach(c=> c.checked=true);
            document.querySelectorAll('.regionMaster').forEach(c=>{ c.checked=true; c.indeterminate=false; });
            document.getElementById('idInput').value='';
            document.getElementById('pinInput').value='';
            document.getElementById('todayOnly').checked=true;
            document.getElementById('minFL').value='';
            document.getElementById('maxFL').value='';
            document.getElementById('maxSpanKm').value='';
            document.getElementById('showLand').checked=true;
            document.getElementById('showSea').checked=true;
            document.getElementById('showPolyline').checked=true;
            NOTAM_REG.forEach(it=>it.layer && !map.hasLayer(it.layer) && it.layer.addTo(map));
          };

          window.quickFL = function(fl){ document.getElementById('minFL').value='FL'+fl; document.getElementById('maxFL').value=''; applyFilter(); };
          window.clearFL = function(){ document.getElementById('minFL').value=''; document.getElementById('maxFL').value=''; applyFilter(); };
          window.setSpan = function(v){ document.getElementById('maxSpanKm').value = (v||''); applyFilter(); };

          // 面板開關 + 拖曳
          const panel=document.getElementById('notamPanel'), miniBtn=document.getElementById('miniBtn');
          document.getElementById('npClose').onclick=function(){ panel.style.display='none'; miniBtn.style.display='inline-block'; };
          miniBtn.onclick=function(){ panel.style.display='block'; miniBtn.style.display='none'; };
          (function(){
            const hdr=panel.querySelector('.hdr'); let sx=0,sy=0,dx=0,dy=0,drag=false;
            hdr.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;dx=panel.offsetLeft;dy=panel.offsetTop;});
            window.addEventListener('mousemove',e=>{ if(!drag) return;
              const nx=dx+(e.clientX-sx), ny=dy+(e.clientY-sy);
              panel.style.left='auto'; panel.style.top=ny+'px';
              panel.style.right=(window.innerWidth-(nx+panel.offsetWidth))+'px'; });
            window.addEventListener('mouseup',()=>drag=false);
          })();

          // 搜尋時間徽章開關
          const tsBadge = document.getElementById('tsBadge');
          const tsToggle = document.getElementById('showTs');
          if (tsBadge && tsToggle) {
            const syncTs = ()=>{ tsBadge.style.display = tsToggle.checked ? 'block' : 'none'; };
            tsToggle.addEventListener('change', syncTs);
            syncTs();
          }

          // 圖例開關
          const legendBox = document.getElementById('mapLegend');
          const lgToggle  = document.getElementById('showLegend');
          if (legendBox && lgToggle) {
            const syncLg = ()=>{ legendBox.style.display = lgToggle.checked ? 'block' : 'none'; };
            lgToggle.addEventListener('change', syncLg);
            syncLg();
          }



          bindRegionMasters();
          applyFilter();
        }

        resolveLayers();
      }
      boot();
    })();
