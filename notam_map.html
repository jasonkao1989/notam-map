<script>
    
    window.TWT_TODAY_START=1756569600000;window.TWT_TODAY_END=1756656000000;
    
    (function(){
      function boot(){
        const map = map_6952e9d2699e6a4a9d3c0dcf002b522f;
        if(!map) return setTimeout(boot, 80);

        // 建立註冊表（目前只有 layerName）
        window.NOTAM_REG = [];
        NOTAM_REG.push({code:'ZSHA',id:'A2511/25',cat:'GENERAL',st:1732848840000,et:1764431940000,lo:null,hi:null,layerName:'feature_group_7b6de63276ea55a5c7d480a3c0aec7a7',layer:null});
NOTAM_REG.push({code:'ZUUU',id:'U3280/25',cat:'GENERAL',st:1751862600000,et:1767196740000,lo:1558.399,hi:2342.51976,layerName:'feature_group_f2a63c3fff39912833668d7a679e2606',layer:null});
NOTAM_REG.push({code:'ZPKM',id:'A2511/25',cat:'SPACE',st:1726810500000,et:null,lo:null,hi:null,layerName:'feature_group_3cdc582cefd80abb306450c6e094e466',layer:null});

        // 解析變數名稱 -> 真正 FeatureGroup，可能需要多次等待
        function resolveLayers(){
          let ok=true;
          NOTAM_REG.forEach(it=>{
            if(!it.layer){
              const obj = window[it.layerName];
              if(obj) it.layer = obj; else ok=false;
            }
          });
          if(!ok) return setTimeout(resolveLayers, 80);
          afterResolved();
        }

        function afterResolved(){
          function showLayer(it)  { if(it.layer && !map.hasLayer(it.layer)) it.layer.addTo(map); }
          function hideLayer(it)  { if(it.layer &&  map.hasLayer(it.layer)) map.removeLayer(it.layer); }

          window.selAll  = (s)=>document.querySelectorAll(s).forEach(x=>x.checked=true);
          window.selNone = (s)=>document.querySelectorAll(s).forEach(x=>x.checked=false);

          function parseIds(text){
            return (text||'').toUpperCase().split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
          }
          function parseFL(s){
            s=(s||'').toUpperCase().trim();
            if(!s) return null;
            let m;
            if((m=s.match(/^FL\s*(\d{2,3})$/))) return parseInt(m[1],10)*100;
            if((m=s.match(/^(\d{2,3})$/)))      return parseInt(m[1],10)*100;
            if((m=s.match(/^(\d+(?:\.\d+)?)\s*FT$/))) return parseFloat(m[1]);
            if((m=s.match(/^(\d+(?:\.\d+)?)\s*M$/)))  return parseFloat(m[1])*3.28084;
            return null;
          }
          const TWT_START = window.TWT_TODAY_START, TWT_END = window.TWT_TODAY_END;
          function overlapInclusive(a1,a2,b1,b2){
            const A1=(a1==null?-Infinity:a1), A2=(a2==null?Infinity:a2);
            const B1=(b1==null?-Infinity:b1), B2=(b2==null?Infinity:b2);
            return Math.max(A1,B1) <= Math.min(A2,B2);
          }
          function selections(){
            const selFIR = Array.from(document.querySelectorAll('.fir:checked')).map(x=>x.value);
            const selCat = Array.from(document.querySelectorAll('.cat:checked')).map(x=>x.value);
            const ids = parseIds(document.getElementById('idInput').value);
            const todayOnly = document.getElementById('todayOnly').checked;
            const minFLft = parseFL(document.getElementById('minFL').value);
            const maxFLft = parseFL(document.getElementById('maxFL').value);
            return {selFIR, selCat, ids, todayOnly, minFLft, maxFLft};
          }

          window.applyFilter = function(){
            const {selFIR, selCat, ids, todayOnly, minFLft, maxFLft} = selections();
            NOTAM_REG.forEach(it=>{
              if(!it.layer) return;
              const okCode = (!selFIR.length) || selFIR.includes(it.code);
              const okCat  = (!selCat.length) || selCat.includes(it.cat);
              const okId   = (!ids.length)   || ids.some(nd=>it.id.includes(nd));
              const okTime = (!todayOnly) || overlapInclusive(it.st,it.et,TWT_START,TWT_END);
              const lo=(it.lo==null?0:it.lo), hi=(it.hi==null?999999:it.hi);
              const fmin=(minFLft==null?-1:minFLft), fmax=(maxFLft==null?9999999:maxFLft);
              const okAlt = (minFLft==null && maxFLft==null) ? true : (Math.max(lo, Math.max(0,fmin)) <= Math.min(hi, fmax));
              if(okCode && okCat && okId && okTime && okAlt) showLayer(it); else hideLayer(it);
            });
          };

          window.resetFilter = function(){
            document.querySelectorAll('.fir,.cat').forEach(c=> c.checked=true);
            document.getElementById('idInput').value='';
            document.getElementById('todayOnly').checked=true;
            document.getElementById('minFL').value='';
            document.getElementById('maxFL').value='';
            NOTAM_REG.forEach(it=>it.layer&&showLayer(it));
            document.getElementById('hiddenTags').innerHTML='';
          };

          window.quickFL = function(fl){ document.getElementById('minFL').value='FL'+fl; document.getElementById('maxFL').value=''; applyFilter(); };
          window.clearFL = function(){ document.getElementById('minFL').value=''; document.getElementById('maxFL').value=''; applyFilter(); };

          // 面板開關 + 拖曳
          const panel=document.getElementById('notamPanel'), miniBtn=document.getElementById('miniBtn');
          document.getElementById('npClose').onclick=function(){ panel.style.display='none'; miniBtn.style.display='inline-block'; };
          miniBtn.onclick=function(){ panel.style.display='block'; miniBtn.style.display='none'; };
          (function(){
            const hdr=panel.querySelector('.hdr'); let sx=0,sy=0,dx=0,dy=0,drag=false;
            hdr.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;dx=panel.offsetLeft;dy=panel.offsetTop;});
            window.addEventListener('mousemove',e=>{ if(!drag) return;
              const nx=dx+(e.clientX-sx), ny=dy+(e.clientY-sy);
              panel.style.left='auto'; panel.style.top=ny+'px';
              panel.style.right=(window.innerWidth-(nx+panel.offsetWidth))+'px'; });
            window.addEventListener('mouseup',()=>drag=false);
          })();

          // 初始化：一開始就執行一次套用（預設全勾 + 只看今天有效）
          applyFilter();
        }

        resolveLayers();
      }
      boot();
    })();
