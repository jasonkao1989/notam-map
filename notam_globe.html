<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NOTAM Globe 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"/>
<style>
  html,body,#cesiumContainer { width:100%; height:100%; margin:0; background:#000; }
  #cesiumContainer { position:relative; }
  .panel {
    position:fixed; top:10px; right:10px; z-index:9999;
    background:rgba(255,255,255,.96); border:1px solid #ccc; border-radius:10px;
    padding:0; font-size:13px; box-shadow:0 2px 12px rgba(0,0,0,.25);
    max-width:400px; max-height:74vh; overflow:auto; resize:both;
  }
  .panel .hdr {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; font-weight:700; border-bottom:1px solid #e8e8e8; cursor:move;
    position:sticky; top:0; background:rgba(255,255,255,.98);
  }
  .panel .body { padding:10px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .badge {
    position:fixed; left:10px; bottom:10px; z-index:9999; background:rgba(255,255,255,.92);
    border:1px solid #d0d0d0; border-radius:8px; padding:3px 6px; font-size:11px; box-shadow:0 1px 6px rgba(0,0,0,.12);
  }
  .legend {
    position:fixed; right:12px; bottom:58px; z-index:9999; background:rgba(255,255,255,.96);
    border:1px solid #d0d0d0; border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 1px 6px rgba(0,0,0,.12);
    min-width:148px;
  }
  .legend .item { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .legend .sw { width:14px; height:14px; border-radius:3px; border:1px solid #777; }
  .warn {
    position:fixed; right:10px; bottom:10px; z-index:9999; background:#fff3cd; color:#5f3e00;
    border:1px solid #ffe69c; border-radius:8px; padding:6px 10px; font-size:12px; max-width:520px;
  }
  .fab {
    position:fixed; right:12px; bottom:12px; z-index:9999;
    background:#1976d2; color:#fff; border:none; border-radius:999px;
    padding:10px 14px; font-weight:700; cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,.35); display:none;
  }
  .slider { width:120px; }
  @media (max-width: 640px) { .panel { max-width:92vw; right:4vw; } }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="uiPanel" class="panel">
  <div class="hdr">
    <span>篩選</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <label style="font-weight:600;font-size:12px;">透明
        <input id="panelOpacity" class="slider" type="range" min="70" max="100" value="96">
      </label>
      <span id="btnClose" style="cursor:pointer;font-weight:900;">×</span>
    </div>
  </div>
  <div class="body">
    <label>底圖</label>
    <select id="basemapSel" style="width:100%; margin:4px 0 8px;">
      <option value="auto" selected>自動（OSM → CartoLight → Wikimedia）</option>
      <option value="OSM">OSM 標準</option>
      <option value="CartoLight">Carto Light</option>
      <option value="CartoDark">Carto Dark</option>
      <option value="Wikimedia">Wikimedia</option>
      <option value="Grid">無底圖（Grid）</option>
    </select>

    <div class="row" style="margin-bottom:6px;">
      <label><input type="checkbox" class="cat" value="SPACE" checked> 太空/火箭</label>
      <label><input type="checkbox" class="cat" value="PROHIBITED" checked> 禁航</label>
      <label><input type="checkbox" class="cat" value="RESTRICTED" checked> 限制</label>
      <label><input type="checkbox" class="cat" value="DANGER" checked> 危險</label>
      <label><input type="checkbox" class="cat" value="GENERAL" checked> 一般</label>
    </div>

    <label>NOTAM ID 篩選（逗號/空白分隔）</label>
    <input id="idInput" placeholder="例如：B3976/25, A1234/25" style="width:100%; margin:4px 0 6px;">

    <label>優先顯示 NOTAM ID（不受任何篩選影響）</label>
    <input id="pinInput" placeholder="例如：P3539/25, A8888/25" style="width:100%; margin:4px 0 6px;">

    <div class="row" style="margin:6px 0;">
      <label><input type="checkbox" id="todayOnly" checked> 只看今天有效（台北）</label>
      <label><input type="checkbox" id="showLegend" checked> 顯示圖例</label>
    </div>

    <label>高度範圍（Flight Level / ft / m；留空不限制）</label>
    <div class="row" style="margin-bottom:6px;">
      <input id="minFL" placeholder="最小，如 FL300 或 300" style="flex:1 1 120px;">
      <input id="maxFL" placeholder="最大，如 FL410 或 410" style="flex:1 1 120px;">
    </div>

    <label>最大對角線（km）— 過濾超大區域</label>
    <div class="row" style="margin-bottom:6px;">
      <input id="maxSpanKm" type="number" min="0" placeholder="如 2000（留空不限制）" style="width:160px">
    </div>

    <label>位置與型態</label>
    <div class="row" style="margin-bottom:8px;">
      <label><input type="checkbox" id="showLand" checked> 顯示陸地（推測）</label>
      <label><input type="checkbox" id="showSea"  checked> 顯示海上（推測）</label>
      <label><input type="checkbox" id="showPolyline" checked> 顯示航段（僅線）</label>
    </div>

    <div class="row"><button id="fitBtn">縮放至資料</button></div>
  </div>
</div>

<!-- 圖例 -->
<div id="legend" class="legend">
  <div class="item"><span class="sw" style="background:#8e24aa;border-color:#8e24aa"></span> 太空/火箭</div>
  <div class="item"><span class="sw" style="background:#d32f2f;border-color:#d32f2f"></span> 禁航</div>
  <div class="item"><span class="sw" style="background:#1976d2;border-color:#1976d2"></span> 限制</div>
  <div class="item"><span class="sw" style="background:#f57c00;border-color:#f57c00"></span> 危險</div>
  <div class="item"><span class="sw" style="background:#2e7d32;border-color:#2e7d32"></span> 一般</div>
</div>

<button id="btnOpen" class="fab">顯示篩選</button>
<div class="badge">搜尋時間：2025年09月20日 00:13（台北）</div>

<script>
  // 用 HTTP 開啟，避免 file:// 跨域
  if (location.protocol === 'file:') {
    const d = document.createElement('div'); d.className='warn';
    d.textContent='偵測到以 file:// 開啟。請改用本機 HTTP 伺服器：python3 -m http.server 8000 → http://localhost:8000/notam_globe.html';
    document.body.appendChild(d);
  }
  // Cesium 靜態檔位置（要在載入 Cesium.js 之前）
  window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium";
</script>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
<script>
  // 先用 Grid 畫布避免黑畫面
  const viewer = new Cesium.Viewer("cesiumContainer", {
    imageryProvider: new Cesium.GridImageryProvider({cells:8, color: Cesium.Color.DARKGRAY, glowColor: Cesium.Color.BLACK}),
    baseLayerPicker:false, geocoder:false, timeline:false, animation:false, sceneModePicker:true,
    navigationHelpButton:false, homeButton:true, fullscreenButton:false,
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    requestRenderMode:true, maximumRenderTimeChange: Infinity
  });
  viewer.scene.backgroundColor = Cesium.Color.BLACK;
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#111");
  viewer.scene.globe.show = true;

  // —— 底圖工廠 & 切換（含自動容錯序列）——
  let currentBaseLayer = null;
  let userSelectedBasemap = false;
  const basemapFactories = {
    OSM: () => new Cesium.UrlTemplateImageryProvider({
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      tilingScheme: new Cesium.WebMercatorTilingScheme(), credit: "© OpenStreetMap"
    }),
    CartoLight: () => new Cesium.UrlTemplateImageryProvider({
      url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
      subdomains: ["a","b","c","d"], tilingScheme: new Cesium.WebMercatorTilingScheme(), credit: "© Carto"
    }),
    CartoDark: () => new Cesium.UrlTemplateImageryProvider({
      url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png",
      subdomains: ["a","b","c","d"], tilingScheme: new Cesium.WebMercatorTilingScheme(), credit: "© Carto"
    }),
    Wikimedia: () => new Cesium.UrlTemplateImageryProvider({
      url: "https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png",
      tilingScheme: new Cesium.WebMercatorTilingScheme(), credit: "© Wikimedia"
    }),
    Grid: () => new Cesium.GridImageryProvider({cells:8, color: Cesium.Color.DARKGRAY, glowColor: Cesium.Color.BLACK})
  };

  function setBasemap(key){
    try { if (currentBaseLayer) viewer.imageryLayers.remove(currentBaseLayer, false); } catch(_){}
    if (key === "Grid") { currentBaseLayer = null; viewer.scene.requestRender(); return; }
    let provider = basemapFactories[key]();
    const layer = viewer.imageryLayers.addImageryProvider(provider);
    currentBaseLayer = layer;
    const p = provider.readyPromise || Promise.resolve();
    p.then(() => { try { viewer.imageryLayers.raiseToTop(layer); } catch(_){}; viewer.scene.requestRender(); })
     .catch(() => {});
  }

  // 自動容錯：OSM → CartoLight → Wikimedia
  const autoOrder = ["OSM", "CartoLight", "Wikimedia"];
  (function tryAuto(idx=0){
    if (userSelectedBasemap) return;
    if (idx >= autoOrder.length) return;
    let timeout = null, provider=null, layer=null;
    try {
      provider = basemapFactories[autoOrder[idx]]();
      layer = viewer.imageryLayers.addImageryProvider(provider);
      currentBaseLayer = layer;

      timeout = setTimeout(() => {
        if (userSelectedBasemap) return;
        if (!provider.ready) {
          try { viewer.imageryLayers.remove(layer, false); } catch(_){}
          tryAuto(idx+1);
        }
      }, 6000);

      const p = provider.readyPromise || Promise.resolve();
      p.then(() => {
        clearTimeout(timeout);
        if (userSelectedBasemap) return;
        try { viewer.imageryLayers.raiseToTop(layer); } catch(_){}
      }).catch(() => {
        clearTimeout(timeout);
        if (userSelectedBasemap) return;
        try { viewer.imageryLayers.remove(layer, false); } catch(_){}
        tryAuto(idx+1);
      });
    } catch(e) {
      if (timeout) clearTimeout(timeout);
      tryAuto(idx+1);
    }
  })();

  // 初始視角
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(121.0, 23.7, 2.0e7),
    orientation: { heading: 0, pitch: -Math.PI/2, roll: 0 }
  });

  // 內嵌 GeoJSON
  const GEOJSON = JSON.parse(atob("eyJ0eXBlIjogIkZlYXR1cmVDb2xsZWN0aW9uIiwgImZlYXR1cmVzIjogW119"));
  const TWT_START = 1758297600000;
  const TWT_END   = 1758384000000;
  const COLORS = {
    SPACE:      Cesium.Color.fromCssColorString("#8e24aa").withAlpha(0.28),
    PROHIBITED: Cesium.Color.fromCssColorString("#d32f2f").withAlpha(0.28),
    RESTRICTED: Cesium.Color.fromCssColorString("#1976d2").withAlpha(0.28),
    DANGER:     Cesium.Color.fromCssColorString("#f57c00").withAlpha(0.28),
    GENERAL:    Cesium.Color.fromCssColorString("#2e7d32").withAlpha(0.28)
  };
  const OUTLINES = {
    SPACE:      Cesium.Color.fromCssColorString("#8e24aa"),
    PROHIBITED: Cesium.Color.fromCssColorString("#d32f2f"),
    RESTRICTED: Cesium.Color.fromCssColorString("#1976d2"),
    DANGER:     Cesium.Color.fromCssColorString("#f57c00"),
    GENERAL:    Cesium.Color.fromCssColorString("#2e7d32")
  };

  let datasource = null;
  Cesium.GeoJsonDataSource.load(GEOJSON, { clampToGround:false }).then(function(ds){
    datasource = ds;
    viewer.dataSources.add(ds);
    ds.entities.values.forEach(function(ent){
      const p = ent.properties || new Cesium.PropertyBag();
      const cat = (p.cat && p.cat.getValue && p.cat.getValue()) || "GENERAL";
      const fill    = (COLORS[cat]   || Cesium.Color.LIME.withAlpha(0.25));
      const outline = (OUTLINES[cat] || Cesium.Color.LIME);
      if (ent.polygon) {
        ent.polygon.material = new Cesium.ColorMaterialProperty(fill);
        ent.polygon.outline = true;
        ent.polygon.outlineColor = outline;
      }
      if (ent.polyline) {
        ent.polyline.material = new Cesium.ColorMaterialProperty(outline);
        ent.polyline.width = 2.0;
      }
      ent.name =
        ((p.code && p.code.getValue && p.code.getValue()) ? p.code.getValue()+" " : "") +
        ((p.id && p.id.getValue && p.id.getValue()) ? p.id.getValue() : "");
    });
    if (ds.entities.values.length) viewer.flyTo(ds);
    bindUI(); applyFilter();
  }).catch(function(e){ console.error("GeoJSON 載入失敗", e); });

  function parseIds(text){ return (text||'').toUpperCase().split(/[\s,]+/).map(s=>s.trim()).filter(Boolean); }
  function parseFL(s){
    s=(s||'').toUpperCase().trim(); if(!s) return null;
    let m;
    if((m=s.match(/^FL\s*(\d{2,3})$/))) return parseInt(m[1],10)*100;
    if((m=s.match(/^(\d{2,3})$/)))      return parseInt(m[1],10)*100;
    if((m=s.match(/^(\d+(?:\.\d+)?)\s*FT$/))) return parseFloat(m[1]);
    if((m=s.match(/^(\d+(?:\.\d+)?)\s*M$/)))  return parseFloat(m[1])*3.28084;
    return null;
  }

  function bindUI(){
    document.querySelectorAll(".cat").forEach(c => c.addEventListener("change", applyFilter));
    ["todayOnly","showLand","showSea","showPolyline","showLegend"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        if (id === "showLegend") {
          document.getElementById("legend").style.display =
            document.getElementById("showLegend").checked ? "block" : "none";
        } else {
          applyFilter();
        }
      });
    });
    ["idInput","pinInput","minFL","maxFL","maxSpanKm"].forEach(id => {
      document.getElementById(id).addEventListener("input", applyFilter);
    });
    document.getElementById("fitBtn").addEventListener("click", () => datasource && viewer.flyTo(datasource));

    // 面板透明度
    const panel = document.getElementById('uiPanel');
    const slider = document.getElementById('panelOpacity');
    const applyOpacity = () => panel.style.background = `rgba(255,255,255, ${ (parseInt(slider.value,10)/100).toFixed(2) })`;
    slider.addEventListener('input', applyOpacity); applyOpacity();

    // 面板收合 / 開啟
    const btnClose = document.getElementById('btnClose');
    const btnOpen  = document.getElementById('btnOpen');
    btnClose.onclick = () => { panel.style.display='none'; btnOpen.style.display='inline-block'; };
    btnOpen.onclick  = () => { panel.style.display='block'; btnOpen.style.display='none'; };

    // 面板拖曳
    (function(){
      const hdr = panel.querySelector('.hdr');
      let dragging=false, sx=0, sy=0, dx=0, dy=0;
      hdr.addEventListener('mousedown', e => { dragging=true; sx=e.clientX; sy=e.clientY; dx=panel.offsetLeft; dy=panel.offsetTop; panel.style.right='auto'; });
      window.addEventListener('mousemove', e => {
        if(!dragging) return;
        const nx = dx + (e.clientX - sx);
        const ny = dy + (e.clientY - sy);
        panel.style.left = (Math.max(0, Math.min(window.innerWidth - panel.offsetWidth,  nx))) + 'px';
        panel.style.top  = (Math.max(0, Math.min(window.innerHeight- panel.offsetHeight, ny))) + 'px';
      });
      window.addEventListener('mouseup', () => dragging=false);
    })();

    // 底圖手動切換
    const sel = document.getElementById('basemapSel');
    sel.addEventListener('change', () => {
      const val = sel.value;
      if (val === 'auto') { userSelectedBasemap = false; return; }
      userSelectedBasemap = true;
      setBasemap(val);
    });
  }

  function applyFilter(){
    if(!datasource) return;
    const allow = Object.fromEntries(Array.from(document.querySelectorAll(".cat")).map(c => [c.value, c.checked]));
    const ids     = parseIds(document.getElementById("idInput").value);
    const pinIds  = parseIds(document.getElementById("pinInput").value);
    const todayOnly = document.getElementById("todayOnly").checked;
    const minFLft = parseFL(document.getElementById("minFL").value);
    const maxFLft = parseFL(document.getElementById("maxFL").value);
    const maxSpan = parseFloat(document.getElementById("maxSpanKm").value);
    const showLand = document.getElementById("showLand").checked;
    const showSea  = document.getElementById("showSea").checked;
    const showPolyline = document.getElementById("showPolyline").checked;

    const overlapInclusive=(a1,a2,b1,b2)=>{ const A1=(a1==null?-Infinity:a1), A2=(a2==null?Infinity:a2);
                                            const B1=(b1==null?-Infinity:b1), B2=(b2==null?Infinity:b2);
                                            return Math.max(A1,B1) <= Math.min(A2,B2); };

    datasource.entities.values.forEach(ent => {
      const p = ent.properties || new Cesium.PropertyBag();
      const cat = p.cat && p.cat.getValue();
      const st = p.st && p.st.getValue();
      const et = p.et && p.et.getValue();
      const sea = (p.sea && p.sea.getValue && p.sea.getValue()) || "UNK";
      const lo  = (p.lo && p.lo.getValue && p.lo.getValue()) ?? null;
      const hi  = (p.hi && p.hi.getValue && p.hi.getValue()) ?? null;
      const span= (p.span && p.span.getValue && p.span.getValue()) ?? null;
      const idv = (p.id && p.id.getValue && p.id.getValue()) || "";
      const name= ent.name || "";
      const lineOnly = (!!ent.polyline && !ent.polygon);

      const isPinned = pinIds.length && pinIds.some(k => idv.includes(k) || name.includes(k));
      if (isPinned) { ent.show = true; return; }

      let ok = !!allow[cat];
      if (ok && todayOnly) ok = overlapInclusive(st, et, TWT_START, TWT_END);
      if (ok && ids.length) ok = ids.some(k => idv.includes(k) || name.includes(k));

      if (ok && (minFLft!=null || maxFLft!=null)) {
        const loF = (lo==null ? 0 : lo), hiF = (hi==null ? 999999 : hi);
        const fmin = (minFLft==null ? -1 : minFLft), fmax = (maxFLft==null ? 9999999 : maxFLft);
        ok = Math.max(loF, 0, fmin) <= Math.min(hiF, fmax);
      }
      if (ok && !isNaN(maxSpan)) ok = (span==null) ? ok : (span <= maxSpan + 1e-6);
      if (ok) {
        if (!showLand && sea === "LAND") ok = false;
        if (!showSea  && sea === "SEA")  ok = false;
      }
      if (ok && !showPolyline && lineOnly) ok = false;

      ent.show = !!ok;
    });
    viewer.scene.requestRender();
  }
</script>
</body></html>
